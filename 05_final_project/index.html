<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anime Finder</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav>
    <h2>Anime <span class="accent">Finder</span></h2>
  </nav>

  <main class="landing">
    <h1>Find your next <span class="accent">obsession</span>.</h1>
    <p>Explore anime series and movies by title, genre or year.</p>

    <div class="searchBarFilter">
      <input type="text" id="search" placeholder="Search anime (e.g. Naruto)">
      <button id="searchButton">Search</button>
      <select id="sort">
        <option value="default">Sort results</option>
        <option value="az">Title: A to Z</option>
        <option value="za">Title: Z to A</option>
        <option value="newest">Newest first</option>
        <option value="oldest">Oldest first</option>
      </select>
    </div>

    <p id="message">Loading anime...</p>
    <section id="animeList" class="anime-list"></section>
  </main>

  <footer>
    
    <p>Copyright © 2026 Anime Finder Project. All rights reserved.</p>
    <p>Anime Database powered by <a href="https://anilist.co/" target="_blank">AniList</a></p>
  </footer>
  <script src="script.js"></script>
</body>
</html>
