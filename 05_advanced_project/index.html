<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Igor Torres</title>
    <link rel="stylesheet" href="./style.css" />
    <script 
      src="https://kit.fontawesome.com/1eb2cce6a9.js" crossorigin="anonymous">
    </script>
  </head>
  <body>
    <section id="landing-page">
      <nav>
        <figure>
          <img
            id="personal-logo"
            src="./assets/torresdev_logo.png"
            alt="My Logo"
          />
        </figure>
        <ul class="nav__link--list">
          <li class="nav__link">
            <a
              href="#about"
              class="
              nav__link--anchor 
              link__hover-effect 
              link__hover-effect--black"
              >About</a>
          </li>
          <li class="nav__link">
            <a
              href="#projects"
              class="
              nav__link--anchor
              link__hover-effect 
              link__hover-effect--black"
              >Projects</a>
          </li>
          <li class="nav__link">
            <a
              href="#contact"
              class="
              nav__link--anchor 
              link__hover-effect 
              link__hover-effect--black"
              >Contact</a>
          </li>
          <li class="nav__link click">
            <a
              href="#"
              class="
              nav__link--anchor 
              link__hover-effect 
              link__hover-effect--black"
              ><i class="fa-solid fa-circle-half-stroke"></i></a>
          </li>
        </ul>
      </nav>
      <header class="header">
        <h1 class="title navy">Hey</h1>
        <h1 class="title teal title--secondary">I'm Igor Torres.</h1>
        <p class="header__para">
          Motivated <b class="navy">Frontend Software Engineer</b> focused on learning modern web technologies and building clean, functional, and responsive web applications with strong attention to detail, user experience, and usability.
          <br>
          Here's a bit more <b class="teal">about me</b>.
        </p>
        <div class="social__list">
          <a href="https://google.com" target="_blank" class="social__link click">
            <i class="fa-brands fa-linkedin-in"></i>
          </a>
          <a href="#" class="social__link click">
            <i class="fa-brands fa-github"></i>
          </a>
          <a href="#" class="social__link click">
            <i class="fa-brands fa-twitter"></i>
          </a>
        </div>
      </header>
      <div class="mail__btn">
        <i class="fa-solid fa-envelope"></i>
      </div>
    </section>
  </body>
</html>
